<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sígueme en Instagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  }
  .card h1 {
    font-size: 24px;
    color: #262626;
    margin-bottom: 10px;
  }
  .card p {
    color: #555;
    font-size: 16px;
    margin-bottom: 24px;
    line-height: 1.4;
  }
  .btn {
    display: inline-block;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 15px;
    color: #fff;
    background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .btn:hover {
    transform: translateY(-2px);
    opacity: 0.92;
  }
  .ig-icon {
    vertical-align: middle;
    margin-right: 6px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>¡Hola! 👋 ¿Cómo están?</h1>
    <p>Síganme en IG 📸</p>
    <a class="btn" href="https://www.instagram.com/feelse3m1lio" target="_blank" rel="noopener noreferrer">
      🔗 Ir a mi Instagram
    </a>
  </div>
</body>
</html>
